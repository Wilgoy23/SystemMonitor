[package]
name = "sysmon"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", features = ["persistence"] }
egui = "0.28"
egui_plot = "0.28"
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nvml-wrapper = "0.12.1"

[profile.release]
opt-level = 3
lto = true
strip = true

[target."cfg(windows)".dependencies]
ntfs-reader = "0.4.5"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
