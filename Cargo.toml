[package]
name = "sysmon"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.28", features = ["persistence"] }
egui = "0.28"
egui_plot = "0.28"
sysinfo = "0.30"
serde = { version = "1", features = ["derive"] }
nvml-wrapper = "0.12.1"

[profile.release]
opt-level = 3
lto = true
strip = true